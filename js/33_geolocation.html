<!DOCTYPE html>
<html>
<head><title>Geolocation</title></head>
<body>

<h2>Current Geographical Location</h2>
<button onclick="getLocation()">Get Location</button>
<p id="location"></p>

<script>
function getLocation() {
    let output = document.getElementById("location");

    if (!navigator.geolocation) {
        output.textContent = "Geolocation is not supported by this browser.";
        return;
    }

    output.textContent = "Requesting location...";

    navigator.geolocation.getCurrentPosition(showPosition, showError);
}

function showPosition(position) {
    document.getElementById("location").innerHTML =
        "Latitude: " + position.coords.latitude +
        "<br>Longitude: " + position.coords.longitude;
}

function showError(error) {
    let message;

    switch (error.code) {
        case error.PERMISSION_DENIED:
            message = "User denied location access.";
            break;
        case error.POSITION_UNAVAILABLE:
            message = "Location information unavailable.";
            break;
        case error.TIMEOUT:
            message = "Request timed out.";
            break;
        default:
            message = "An unknown error occurred.";
    }

    document.getElementById("location").textContent = message;
}
</script>

</body>
</html>
