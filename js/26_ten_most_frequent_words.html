<!DOCTYPE html>
<html>
<head><title>Ten Most Frequent Words</title></head>
<body>
<h2>Ten Most Frequent Words</h2>

<textarea id="text" rows="8" cols="60"
    placeholder="Enter a paragraph"></textarea><br><br>
<button onclick="findWords()">Find Words</button>

<pre id="result"></pre>

<script>
function tenMostFrequentWords(text) {
    let words = text.toLowerCase().match(/\b\w+\b/g) || [];
    let frequency = {};

    words.forEach(word => {
        frequency[word] = (frequency[word] || 0) + 1;
    });

    return Object.entries(frequency)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 10);
}

function findWords() {
    let text = document.getElementById("text").value;
    document.getElementById("result").textContent =
        JSON.stringify(tenMostFrequentWords(text), null, 2);
}
</script>
</body>
</html>
