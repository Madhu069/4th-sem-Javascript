<!DOCTYPE html>
<html>
<head><title>Age Calculator</title></head>
<body>
<h2>Age Calculator</h2>

<input type="date" id="dob">
<button onclick="calculateAge()">Calculate Age</button>
<h3 id="result"></h3>

<script>
function calculateAge() {
    let value = document.getElementById("dob").value;

    if (!value) {
        document.getElementById("result").textContent = "Please select your date of birth.";
        return;
    }

    let dob = new Date(value);
    let today = new Date();

    let age = today.getFullYear() - dob.getFullYear();
    let month = today.getMonth() - dob.getMonth();

    if (month < 0 || (month === 0 && today.getDate() < dob.getDate())) {
        age--;
    }

    document.getElementById("result").textContent = "Your age is: " + age;
}
</script>
</body>
</html>
